spring.application.name=payment-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:paymentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always

resilience4j.circuitbreaker.instances.serverController.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.serverController.slidingWindowSize=5
resilience4j.circuitbreaker.instances.serverController.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.serverController.failureRateThreshold=50
resilience4j.circuitbreaker.instances.serverController.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.serverController.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.serverController.ignoreExceptions=com.example.paymentservice.service.ResourceNotFoundException,com.example.paymentservice.idempotency.service.MissingIdempotencyKeyException,com.example.paymentservice.idempotency.service.IdempotencyConflictException,com.example.paymentservice.idempotency.service.IdempotencyProcessingException

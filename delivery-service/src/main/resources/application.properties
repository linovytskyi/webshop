spring.application.name=delivery-service
server.port=8083

spring.datasource.url=jdbc:h2:mem:deliverydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always

resilience4j.circuitbreaker.instances.serverController.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.serverController.slidingWindowSize=5
resilience4j.circuitbreaker.instances.serverController.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.serverController.failureRateThreshold=50
resilience4j.circuitbreaker.instances.serverController.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.serverController.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.serverController.ignoreExceptions=com.example.deliveryservice.service.ResourceNotFoundException

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=delivery-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=com.example.orderservice.kafka.dto.OrderPaidEvent:com.example.deliveryservice.kafka.dto.OrderPaidEvent
